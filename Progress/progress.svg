<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120">
  <defs>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6600"/>
      <stop offset="50%" style="stop-color:#FF9900"/>
      <stop offset="100%" style="stop-color:#FFCC00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="120" fill="url(#trackGrad)" rx="8"/>

  <!-- Track line (dashed) -->
  <line x1="60" y1="70" x2="740" y2="70" stroke="#333" stroke-width="2" stroke-dasharray="8,6"/>

  <!-- Orange race line (progress fill) -->
  <line x1="60" y1="70" x2="400" y2="70" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <animate attributeName="x2" values="60;400;60" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </line>

  <!-- Cubesat icon -->
  <g filter="url(#glow)">
    <rect x="0" y="52" width="28" height="28" rx="3" fill="#FF9900" stroke="#FFCC00" stroke-width="1.5">
      <animate attributeName="x" values="46;386;46" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </rect>
    <!-- Solar panels -->
    <rect x="0" y="60" width="8" height="12" rx="1" fill="#FFCC00" opacity="0.8">
      <animate attributeName="x" values="36;376;36" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </rect>
    <rect x="0" y="60" width="8" height="12" rx="1" fill="#FFCC00" opacity="0.8">
      <animate attributeName="x" values="76;416;76" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    </rect>
  </g>

  <!-- Milestone markers -->
  <circle cx="200" cy="70" r="5" fill="#333" stroke="#FF6600" stroke-width="1.5"/>
  <circle cx="400" cy="70" r="5" fill="#333" stroke="#FF6600" stroke-width="1.5"/>
  <circle cx="600" cy="70" r="5" fill="#333" stroke="#FF6600" stroke-width="1.5"/>
  <circle cx="740" cy="70" r="6" fill="#FF9900" stroke="#FFCC00" stroke-width="2"/>

  <!-- Labels -->
  <text x="60" y="100" fill="#666" font-family="monospace" font-size="9">START</text>
  <text x="180" y="100" fill="#666" font-family="monospace" font-size="9">DESIGN</text>
  <text x="380" y="100" fill="#666" font-family="monospace" font-size="9">BUILD</text>
  <text x="580" y="100" fill="#666" font-family="monospace" font-size="9">TEST</text>
  <text x="710" y="100" fill="#FFCC00" font-family="monospace" font-size="9">LAUNCH</text>

  <!-- Title -->
  <text x="400" y="28" fill="#FF9900" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">1U CUBESAT // MISSION PROGRESS</text>
  <text x="400" y="44" fill="#666" font-family="monospace" font-size="10" text-anchor="middle">STONY BROOK NANOSATELLITE DIVISION</text>
</svg>
